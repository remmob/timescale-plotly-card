type: custom:timescale-plotly-card
title: Livingroom

# Time selection
show_time_selector: true
default_range: 12h
time_ranges:
  - 1h
  - 2h
  - 3h
  - 6h
  - 12h
  - 24h
  - 48h
  - 72h
  - custom
show_custom_button: true

# Data options
downsample: 300
height: 400
y_margin: 2

# Entities (multi-series, with per-series options)
entities:
  - sensor_id: sensor.temperature_woonkamer
    name: Temperatuur woonkamer
    tooltip_label_text: Temperatuur woonkamer
    line_color: rgb(255, 99, 132)
    fill_color: rgba(255, 99, 132, 0.1)
    fill: true
    unit: °C
    database: ltss
    table: sensor_minute_ltss
    downsample_methode: last
    downsample: 60
    connect_gaps: true           # NEW: connect gaps for this series
    extend_edge_gaps: true       # NEW: extend first/last value to chart edge
  - sensor_id: sensor.amber_4h_average_ambient_temperature
    name: Buiten temp 4h gemiddelde
    tooltip_label_text: Buiten temp 4h gemiddelde
    line_color: rgb(54, 162, 235)
    fill_color: rgba(54, 162, 235, 0.3)
    fill: true
    unit: °C
    yaxis: left
    database: scribe
    table: sensor_minute_scribe 
    downsample_methode: last
    downsample: 60
    connect_gaps: true
    extend_edge_gaps: true
  - sensor_id: sensor.amber_24h_average_ambient_temperature
    name: Buiten temp 24h gemiddelde
    tooltip_label_text: Buiten temp 24h gemiddelde
    line_color: rgb(50,205,50)
    fill_color: rgba(50,205,50,0.3)
    fill: true
    unit: °C
    yaxis: left
    database: scribe
    table: sensor_minute_scribe 
    downsample_methode: last
    downsample: 60
    connect_gaps: true
    extend_edge_gaps: true

# Chart styling
line_shape: linear
line_width: 2
margin_top: 60
margin_right: 10
margin_bottom: 40
margin_left: 50

# Axis styling
xaxis_title: Time
yaxis_title_left: C
tooltip_label_text: Temperatuur woonkamer
grid_color: rgba(128,128,128,0.2)
axis_title_offset_y: 100px
axis_title_offset_left: 20px
axis_title_offset_right: 40px

# Background colors
paper_bgcolor: rgba(0,0,0,0)
plot_bgcolor: rgba(0,0,0,0)
font_color: var(--primary-text-color)

# Button styling
selector_background_color: var(--card-background-color)
button_background_color: var(--primary-background-color)
button_border_color: var(--divider-color)
button_text_color: var(--primary-text-color)
button_active_color: var(--primary-color)
button_radius: 4px
button_hover_color: var(--secondary-background-color)
button_hover_text_color: var(--primary-text-color)
button_active_text_color: white

# Modebar (toolbar) styling
show_modebar: true
modebar_bg_color: rgba(255,255,255,0.9)
modebar_radius: 4px
modebar_icon_color: var(--primary-text-color)
modebar_icon_hover_color: var(--primary-color)
modebar_icon_active_color: var(--primary-color)

# Custom range styling
custom_range_background_color: var(--card-background-color)
custom_range_border_color: var(--divider-color)
custom_range_text_color: var(--primary-text-color)
custom_range_label_size: 13px

# Date input styling
date_input_background_color: var(--primary-background-color)
date_input_border_color: var(--divider-color)
date_input_text_color: var(--primary-text-color)
date_input_padding: 4px 8px
date_input_radius: 4px
date_input_size: 13px
date_input_accent_color: var(--primary-color)
date_input_scheme: dark
date_input_focus_color: rgba(3,169,244,0.4)
date_input_caret_color: var(--primary-text-color)
date_input_field_background_color: transparent
date_picker_icon_filter: invert(0.9)
date_picker_icon_opacity: 0.8

# Apply button styling
apply_button_padding: 6px 16px
apply_button_background_color: var(--primary-color)
apply_button_border_color: transparent
apply_button_text_color: white
apply_button_radius: 4px
apply_button_size: 13px
apply_button_hover_color: var(--primary-color)


